name: CI/CD Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  # ===================================================
  # GIAI ĐOẠN 1: CI (Quality Gate & TypeScript Check)
  # Kiểm tra code trực tiếp trên GitHub Runner
  # Nếu có lỗi sẽ dừng ngay và báo chính xác file + dòng
  # ===================================================
  ci-check:
    name: CI Check TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend_admin/package-lock.json
            frontend_client/package-lock.json

      - name: Kiểm tra Frontend Admin (Type Check & Vite Build)
        run: |
          cd frontend_admin
          npm ci
          npm run build

      - name: Kiểm tra Frontend Client (Type Check & Next.js Build)
        run: |
          cd frontend_client
          npm ci
          npm run build

  # ===================================================
  # GIAI ĐOẠN 2: CD (Build & Push Docker Images)
  # Chỉ chạy khi bước CI ở trên thành công 100%
  # ===================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: [ci-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend_client
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/frontend_client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Admin Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend_admin
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/frontend_admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo to copy compose file
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/theluki/theluki"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OWNER_LC
          script: |
            cd /home/theluki/theluki
            
            # Export biến môi trường cho Docker Compose
            export GH_REPO_OWNER="${OWNER_LC}"
            export MONGODBATLAS="${{ secrets.MONGODBATLAS }}"
            export JWT_ACCESS_SECRET="${{ secrets.JWT_ACCESS_SECRET }}"
            export JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export VIETTELPOST_BASE_URL="${{ secrets.VIETTELPOST_BASE_URL }}"
            export VIETTELPOST_USERNAME="${{ secrets.VIETTELPOST_USERNAME }}"
            export VIETTELPOST_PASSWORD="${{ secrets.VIETTELPOST_PASSWORD }}"
            export SENDER_ADDRESS="${{ secrets.SENDER_ADDRESS }}"
            export VIETTELPOST_TOKEN="${{ secrets.VIETTELPOST_TOKEN }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            # VNPAY SANDBOX CONFIG
            export VNPAY_TMN_CODE="${{ secrets.VNPAY_TMN_CODE }}"
            export VNPAY_HASH_SECRET="${{ secrets.VNPAY_HASH_SECRET }}"
            export VNPAY_URL="${{ secrets.VNPAY_URL }}"
            export VNPAY_API_URL="${{ secrets.VNPAY_API_URL }}"
            export VNPAY_RETURN_URL="${{ secrets.VNPAY_RETURN_URL }}"
            # MOMO SANDBOX CONFIG
            export MOMO_PARTNER_CODE="${{ secrets.MOMO_PARTNER_CODE }}"
            export MOMO_ACCESS_KEY="${{ secrets.MOMO_ACCESS_KEY }}"
            export MOMO_SECRET_KEY="${{ secrets.MOMO_SECRET_KEY }}"
            export MOMO_API_URL="${{ secrets.MOMO_API_URL }}"
            export MOMO_REDIRECT_URL="${{ secrets.MOMO_REDIRECT_URL }}"
            export MOMO_IPN_URL="${{ secrets.MOMO_IPN_URL }}"
            # SEPAY CONFIG (QUẦY POS)
            export SEPAY_BANK_NAME="${{ secrets.SEPAY_BANK_NAME }}"
            export SEPAY_ACCOUNT_NO="${{ secrets.SEPAY_ACCOUNT_NO }}"
            export SEPAY_ACCOUNT_NAME="${{ secrets.SEPAY_ACCOUNT_NAME }}"
            export SEPAY_API_KEY="${{ secrets.SEPAY_API_KEY }}"
            export SEPAY_WEBHOOK_URL="${{ secrets.SEPAY_WEBHOOK_URL }}"
            # TELEGRAM CRONJOB
            export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
            export TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"

            # Đăng nhập GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Kéo images mới nhất và khởi chạy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Xóa các image cũ để tiết kiệm ổ cứng
            docker image prune -f
